name: Production Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify login and deployed safety assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://tbrstore.vercel.app"
          login="$(curl --fail --silent --show-error --location --retry 2 --max-time 20 "$base/login.html")"
          nav="$(curl --fail --silent --show-error --retry 2 --max-time 20 "$base/js/nav.js?monitor=1")"
          service="$(curl --fail --silent --show-error --retry 2 --max-time 20 "$base/js/supabaseService.js?v=46&monitor=1")"
          db="$(curl --fail --silent --show-error --retry 2 --max-time 20 "$base/js/db.js?v=37&monitor=1")"
          jobs="$(curl --fail --silent --show-error --retry 2 --max-time 20 "$base/js/jobs.js?v=33&monitor=1")"
          stock="$(curl --fail --silent --show-error --retry 2 --max-time 20 "$base/js/stock.js?v=34&monitor=1")"
          purchasing="$(curl --fail --silent --show-error --retry 2 --max-time 20 "$base/js/purchasing.js?v=32&monitor=1")"
          billing="$(curl --fail --silent --show-error --retry 2 --max-time 20 "$base/js/billing.js?v=33&monitor=1")"
          docs="$(curl --fail --silent --show-error --retry 2 --max-time 20 "$base/js/docs.js?v=35&monitor=1")"
          settings="$(curl --fail --silent --show-error --retry 2 --max-time 20 "$base/js/settings.js?v=31&monitor=1")"
          customers="$(curl --fail --silent --show-error --retry 2 --max-time 20 "$base/js/customers.js?v=31&monitor=1")"
          grep -q 'id="loginUsername"' <<<"$login"
          grep -q 'function canAccessTab' <<<"$nav"
          grep -q "rpc('create_requisition_atomic'" <<<"$service"
          grep -q "rpc('adjust_stock_atomic'" <<<"$service"
          grep -q "rpc('receive_purchase_order_atomic'" <<<"$service"
          grep -q "rpc('save_stock_item_atomic'" <<<"$service"
          grep -q "rpc('archive_stock_item_atomic'" <<<"$service"
          grep -q "rpc('create_purchase_order_atomic'" <<<"$service"
          grep -q "rpc('cancel_purchase_order_atomic'" <<<"$service"
          grep -q "rpc('update_job_atomic'" <<<"$service"
          grep -q "rpc('create_job_atomic'" <<<"$service"
          grep -q "rpc('create_invoice_atomic'" <<<"$service"
          grep -q "rpc('create_quote_atomic'" <<<"$service"
          grep -q "rpc('convert_quote_atomic'" <<<"$service"
          grep -q "rpc('save_service_atomic'" <<<"$service"
          grep -q "rpc('archive_service_atomic'" <<<"$service"
          grep -q "rpc('save_customer_atomic'" <<<"$service"
          grep -q "rpc('delete_unused_customer_atomic'" <<<"$service"
          grep -q "rpc('save_vehicle_atomic'" <<<"$service"
          grep -q "rpc('delete_unused_vehicle_atomic'" <<<"$service"
          grep -q "rpc('update_invoice_tax_details_atomic'" <<<"$service"
          grep -q "rpc('repair_invoice_job_link_atomic'" <<<"$service"
          grep -q "reportSupabaseWriteError(err, 'addInvoice')" <<<"$service"
          grep -q 'canManageStock' <<<"$service"
          grep -q 'await addRequisition' <<<"$jobs"
          grep -q 'await updateJobAtomic' <<<"$jobs"
          grep -q 'await createJobAtomic' <<<"$jobs"
          if grep -Eq '\baddJob\(' <<<"$service$jobs"; then
            echo "Unsafe direct job creation detected in deployed workflow"
            exit 1
          fi
          if grep -Eq '\b(updateJob|updateVehicle)\(' <<<"$jobs"; then
            echo "Unsafe direct job update detected in deployed workflow"
            exit 1
          fi
          grep -q 'await adjustStockAtomic' <<<"$stock"
          grep -q 'await saveStockItemAtomic' <<<"$stock"
          grep -q 'await archiveStockItemAtomic' <<<"$stock"
          grep -q 'await receivePurchaseOrderAtomic' <<<"$purchasing"
          grep -q 'await createPurchaseOrderAtomic' <<<"$purchasing"
          grep -q 'await cancelPurchaseOrderAtomic' <<<"$purchasing"
          grep -q 'if (billedJob) billedJob.status = 5' <<<"$billing"
          grep -q 'await createQuoteAtomic(qt)' <<<"$billing"
          grep -q 'await convertQuoteAtomic(q.id)' <<<"$docs"
          grep -q 'await saveServiceAtomic' <<<"$settings"
          grep -q 'await archiveServiceAtomic' <<<"$settings"
          grep -q 'await updateCustomer' <<<"$customers"
          grep -q 'await updateVehicle' <<<"$customers"
          grep -q 'await deleteCustomer' <<<"$customers"
          grep -q 'await deleteVehicle' <<<"$customers"
          grep -q 'await repairInvoiceJobLinkAtomic' <<<"$db"
          grep -q 'await updateInvoiceTaxDetails' <<<"$docs"
          if grep -q 'syncSeedServicesToSupabase' <<<"$db"; then
            echo "Unsafe login-time service overwrite detected"
            exit 1
          fi
          if grep -Eq '\b(addQuote|updateQuote|deleteQuote)\(' <<<"$service$billing$docs"; then
            echo "Unsafe direct quotation write detected in deployed workflow"
            exit 1
          fi
          if grep -Eq 'function (updateInvoicePaid|updateInvoiceItemCosts|deleteInvoice)\(' <<<"$service"; then
            echo "Unsafe legacy invoice maintenance helper detected"
            exit 1
          fi
          if grep -Eq '\b(addPO|updatePO|deletePO)\(' <<<"$purchasing"; then
            echo "Unsafe direct purchase-order write detected in deployed purchasing workflow"
            exit 1
          fi
          if grep -q 'updateStockBySku' <<<"$jobs$stock$purchasing"; then
            echo "Unsafe direct stock synchronization detected in a deployed workflow"
            exit 1
          fi
          echo "Production login and safety assets verified"
