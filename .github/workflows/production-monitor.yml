name: Production Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify login and deployed safety assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://tbrstore.vercel.app"
          login="$(curl --fail --silent --show-error --location --retry 2 --max-time 20 "$base/login.html")"
          nav="$(curl --fail --silent --show-error --retry 2 --max-time 20 "$base/js/nav.js?monitor=1")"
          service="$(curl --fail --silent --show-error --retry 2 --max-time 20 "$base/js/supabaseService.js?v=35&monitor=1")"
          jobs="$(curl --fail --silent --show-error --retry 2 --max-time 20 "$base/js/jobs.js?v=31&monitor=1")"
          grep -q 'id="loginUsername"' <<<"$login"
          grep -q 'function canAccessTab' <<<"$nav"
          grep -q "rpc('create_requisition_atomic'" <<<"$service"
          grep -q 'canManageStock' <<<"$service"
          grep -q 'await addRequisition' <<<"$jobs"
          if grep -q 'updateStockBySku' <<<"$jobs"; then
            echo "Unsafe direct stock synchronization detected in deployed jobs.js"
            exit 1
          fi
          echo "Production login and safety assets verified"
