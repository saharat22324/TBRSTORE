name: Encrypted Production Backup

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || { echo "SUPABASE_DB_PASSWORD is not configured"; exit 1; }
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE" || { echo "BACKUP_ENCRYPTION_PASSPHRASE is not configured"; exit 1; }

      - name: Install PostgreSQL and encryption tools
        shell: bash
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 gnupg
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Create and verify encrypted backup
        shell: bash
        run: |
          args=(
            --output-directory backups-ci
            --password-env SUPABASE_DB_PASSWORD
            --encrypt-passphrase-env BACKUP_ENCRYPTION_PASSPHRASE
          )
          if [ -n "$SUPABASE_DB_HOST" ]; then args+=(--host "$SUPABASE_DB_HOST"); fi
          if [ -n "$SUPABASE_DB_PORT" ]; then args+=(--port "$SUPABASE_DB_PORT"); fi
          if [ -n "$SUPABASE_DB_USER" ]; then args+=(--username "$SUPABASE_DB_USER"); fi
          python scripts/backup-supabase.py "${args[@]}"
          test "$(find backups-ci -type f -name '*.dump' | wc -l)" -eq 0
          test "$(find backups-ci -type f -name '*.dump.gpg' | wc -l)" -eq 1
          sha256sum --check backups-ci/*.sha256

      - name: Store encrypted backup for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: tbr-production-backup-${{ github.run_id }}
          path: |
            backups-ci/*.dump.gpg
            backups-ci/*.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Remove runner backup files
        if: always()
        run: rm -rf backups-ci
